# Publishes a release whenever main has a version (package.json) that hasn't been
# released yet. GitHub creates the v<version> tag itself. Can also be started from
# the Actions tab (Run workflow). Needs the secret UPDATE_SIGNING_KEY.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Is this version new?
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released; nothing to do."; echo "new=false" >> "$GITHUB_OUTPUT"
          else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.version.outputs.new == 'true'
        run: npm ci
      - name: Unit tests
        if: steps.version.outputs.new == 'true'
        run: npm test
      - name: App end-to-end tests
        if: steps.version.outputs.new == 'true'
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64
          xvfb-run -a npm run test:gui
      - name: Build Windows app
        if: steps.version.outputs.new == 'true'
        run: npm run build:win
      - name: Sign update package
        if: steps.version.outputs.new == 'true'
        env:
          MLS_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: npm run make-update
      - name: Publish release
        if: steps.version.outputs.new == 'true'
        run: |
          v=${{ steps.version.outputs.version }}
          node -p "require('./dist/update/update.json').notes" > notes.md
          gh release create "v$v" dist/Moto-Lines-Studio-v$v-Windows.zip dist/update/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Moto Lines Studio $v" --notes-file notes.md
